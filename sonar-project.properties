# SonarQube Cloud - alcance del modulo Financiero (Anexo B.4)
sonar.organization=nexacore-calidad
sonar.projectKey=nexacore-calidad_backend
sonar.projectName=NexaCore Backend - Finanzas
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Codigo fuente: solo el modulo Financiero
sonar.sources=.
sonar.inclusions=finance/**/*.js
sonar.exclusions=finance/**/deudas*.js,\
  finance/services/migradores/comprasInternacionales.js,\
  finance/services/migradores/cuentasPorCobrar.js,\
  finance/services/migradores/totalesFinancieros.js,\
  finance/services/migradores/sueldosHistoricos.js,\
  node_modules/**,coverage/**

# Tests y cobertura
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info